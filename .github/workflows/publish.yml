name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install

      # Same gates as test.yml, in the same order. Without this a release can
      # publish from a red `dev`: the branch gate runs on push/PR, but the
      # release path did not, so a typecheck failure shipped to npm.
      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Set version from release tag
        run: npm version "$GITHUB_REF_NAME" --no-git-tag-version

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
